name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend API & Permit/Train Tests (Python 3.12)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      FIREBASE_MODE: local
      DEV_AUTH_BYPASS: "true"
      RAPIDAPI_LIVE_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements.txt

      - name: Seed 8-state baseline data into local NoSQL store
        run: python data/seed/seed_firestore.py --target local

      - name: Run FastAPI test suite (29 tests)
        run: pytest services/api/tests -v

  frontend-build:
    name: Web PWA Typecheck & Production Build (Node 22)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Run ESLint code quality check
        run: npm --prefix apps/web run lint

      - name: Run strict TypeScript check
        run: npm --prefix apps/web run typecheck

      - name: Run frontend unit & data integrity tests
        run: npm --prefix apps/web test

      - name: Build production Next.js PWA
        run: npm --prefix apps/web run build

  docker-publish-and-deploy:
    name: Build & Publish Docker Images (GHCR) + Trigger Deploy Hooks
    needs: [backend-test, frontend-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner/name for GHCR tags
        id: repo
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push API image (infra/Dockerfile.api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/api:latest
            ghcr.io/${{ steps.repo.outputs.name }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web PWA image (infra/Dockerfile.web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/web:latest
            ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trigger optional cloud deploy webhooks (Render / Vercel / Railway)
        env:
          RENDER_API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          RENDER_WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_API_HOOK" ]; then
            echo "Triggering Render API deploy hook..."
            curl -fsSL -X POST "$RENDER_API_HOOK" || true
          fi
          if [ -n "$RENDER_WEB_HOOK" ]; then
            echo "Triggering Render Web deploy hook..."
            curl -fsSL -X POST "$RENDER_WEB_HOOK" || true
          fi
          if [ -n "$VERCEL_HOOK" ]; then
            echo "Triggering Vercel deploy hook..."
            curl -fsSL -X POST "$VERCEL_HOOK" || true
          fi
