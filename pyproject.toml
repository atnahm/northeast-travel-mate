[project]
name = "northeast-travel-mate"
version = "1.0.0"
description = "PS08: TravelMateNE — North East India Tourism & Culture Explorer (FastAPI + Next.js 15 PWA + Cloud Firestore)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Uddipta" }]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "firebase-admin>=6.6.0,<7.0.0",
    "google-cloud-firestore>=2.19.0,<3.0.0",
    "redis>=5.2.0,<6.0.0",
    "httpx>=0.27.2,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
