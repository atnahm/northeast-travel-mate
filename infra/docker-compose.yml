services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_BASE_URL: http://agent:8001
    depends_on:
      - redis
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile.agent
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      API_BASE_URL: http://api:8000
      AGENT_BASE_URL: http://agent:8001
    depends_on:
      - api
      - agent
    restart: unless-stopped

volumes:
  redis_data:
